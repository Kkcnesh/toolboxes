services:
  api:
    build: .
    platform: linux/arm64
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://toolbox:toolbox@postgres:5432/toolbox
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-toolbox-builds}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      CLAMAV_HOST: clamav
      BUILD_WORKDIR: /tmp/toolbox-builds
    volumes:
      - build-workdir:/tmp/toolbox-builds
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    platform: linux/arm64
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://toolbox:toolbox@postgres:5432/toolbox
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-toolbox-builds}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      CLAMAV_HOST: clamav
      BUILD_WORKDIR: /tmp/toolbox-builds
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - build-workdir:/tmp/toolbox-builds
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2

  redis:
    image: redis:7-bookworm
    platform: linux/arm64
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16-bookworm
    platform: linux/arm64
    environment:
      POSTGRES_USER: toolbox
      POSTGRES_PASSWORD: toolbox
      POSTGRES_DB: toolbox
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbox -d toolbox"]
      interval: 2s
      timeout: 3s
      retries: 30

  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    environment:
      # A build's own venv legitimately contains symlinks (venv/lib64 -> lib,
      # etc.) that stay within the scanned tree. Without this, clamd refuses
      # to scan the path at all rather than just skipping those entries -
      # safe to allow here since we're scanning our own build output, not
      # untrusted user uploads.
      CLAMD_CONF_FollowDirectorySymlinks: "yes"
      CLAMD_CONF_FollowFileSymlinks: "yes"
    ports:
      - "3310:3310"
    volumes:
      - build-workdir:/tmp/toolbox-builds
      - clamav-data:/var/lib/clamav

volumes:
  postgres-data:
  clamav-data:
  build-workdir:
